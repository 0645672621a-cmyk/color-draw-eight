<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="从红、橙、黄、绿、蓝、紫、黑、白、粉、棕、金、银、肉色中随机抽取一种颜色，同一轮不会重复。">
  <title>随机抽颜色</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2320232a'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23ffd84a'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f0e8;
      --ink: #20232a;
      --muted: #6d6b67;
      --line: rgba(32, 35, 42, .18);
      --button-bg: #20232a;
      --button-ink: #fff;
      --shadow: 0 18px 50px rgba(20, 20, 20, .16);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color 380ms cubic-bezier(.2,.8,.2,1), color 260ms ease;
      overscroll-behavior: none;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 980px);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) clamp(20px, 5vw, 56px) max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    .topbar, .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 760;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .counter {
      flex: none;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: .88rem;
      font-weight: 700;
    }

    main {
      min-height: 470px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage {
      width: 100%;
      display: flex;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .caption {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted);
      font-size: clamp(.95rem, 3vw, 1.1rem);
      letter-spacing: .08em;
    }

    .color-orb {
      width: clamp(210px, 42vw, 320px);
      aspect-ratio: 1;
      margin: clamp(24px, 5vh, 42px) 0 22px;
      border: 2px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      transition: transform 320ms cubic-bezier(.2,.8,.2,1), border-color 260ms ease;
    }

    .color-orb::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--line);
      border-radius: inherit;
      opacity: .55;
    }

    .color-char {
      position: relative;
      z-index: 1;
      font-size: clamp(7rem, 23vw, 11rem);
      font-weight: 760;
      line-height: 1;
      letter-spacing: -.08em;
      transform: translateX(-.04em);
    }

    .color-name {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 760;
    }

    .color-code {
      min-height: 1.5em;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .14em;
    }

    .draw-button {
      width: min(100%, 350px);
      min-height: 60px;
      margin-top: clamp(30px, 5vh, 48px);
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--button-ink);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-size: 1.08rem;
      font-weight: 760;
      letter-spacing: .03em;
      transition: transform 140ms ease, opacity 140ms ease, background-color 260ms ease, color 260ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .draw-button:hover { transform: translateY(-2px); }
    .draw-button:active { transform: scale(.98); }
    .draw-button:focus-visible, .reset:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }

    .reset {
      min-height: 44px;
      margin-top: 10px;
      padding: 8px 18px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 650;
      visibility: hidden;
    }

    .reset.visible { visibility: visible; }

    .history {
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .history-head {
      font-size: .9rem;
      font-weight: 720;
    }

    .history-count { color: var(--muted); }

    .chips {
      min-height: 44px;
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .chip {
      min-height: 38px;
      padding: 6px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      font-weight: 700;
      animation: chip-in 260ms cubic-bezier(.2,.8,.2,1) both;
    }

    .dot {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(32,35,42,.18);
      border-radius: 50%;
    }

    .empty-note {
      margin: 0;
      align-self: center;
      color: var(--muted);
      font-size: .87rem;
    }

    .pop .color-orb { animation: result-pop 420ms cubic-bezier(.18,.9,.32,1.25); }

    @keyframes result-pop {
      0% { transform: scale(.78); opacity: .3; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes chip-in {
      from { transform: translateY(8px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (min-width: 760px) {
      .app { padding-top: 42px; padding-bottom: 36px; }
      main { min-height: 560px; }
      .chips { max-width: 720px; }
    }

    @media (max-height: 720px) {
      .app { gap: 14px; padding-top: 18px; padding-bottom: 18px; }
      main { min-height: 390px; }
      .color-orb { width: 190px; margin: 18px 0 14px; }
      .color-char { font-size: 6.5rem; }
      .draw-button { margin-top: 24px; min-height: 54px; }
      .history { padding-top: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">COLOR DRAW · 01—13</p>
        <h1>随机抽颜色</h1>
      </div>
      <div class="counter" id="counter" aria-live="polite">剩余 13 / 13</div>
    </header>

    <main>
      <section class="stage" aria-labelledby="resultName">
        <p class="caption" id="caption">13种颜色 · 每种只会出现一次</p>
        <div class="color-orb" aria-hidden="true">
          <span class="color-char" id="colorChar">?</span>
        </div>
        <h2 class="color-name" id="resultName">下一种，会是什么颜色？</h2>
        <p class="color-code" id="colorCode">&nbsp;</p>
        <button class="draw-button" id="drawButton" type="button">开始抽取</button>
        <button class="reset" id="resetButton" type="button">重新开始</button>
      </section>
    </main>

    <section class="history" aria-labelledby="historyTitle">
      <div class="history-head">
        <span id="historyTitle">抽取记录</span>
        <span class="history-count" id="historyCount">0 / 13</span>
      </div>
      <div class="chips" id="chips">
        <p class="empty-note">抽到的颜色会依次出现在这里</p>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const COLORS = [
        { id: 'red', name: '红', label: '红色', hex: '#E6434B', light: false },
        { id: 'orange', name: '橙', label: '橙色', hex: '#FF9F43', light: true },
        { id: 'yellow', name: '黄', label: '黄色', hex: '#FFD84A', light: true },
        { id: 'green', name: '绿', label: '绿色', hex: '#36A779', light: false },
        { id: 'blue', name: '蓝', label: '蓝色', hex: '#3478DE', light: false },
        { id: 'purple', name: '紫', label: '紫色', hex: '#8056C9', light: false },
        { id: 'black', name: '黑', label: '黑色', hex: '#20232A', light: false },
        { id: 'white', name: '白', label: '白色', hex: '#FFFFFF', light: true },
        { id: 'pink', name: '粉', label: '粉色', hex: '#EC69AE', light: true },
        { id: 'brown', name: '棕', label: '棕色', hex: '#795037', light: false },
        { id: 'gold', name: '金', label: '金色', hex: '#C49A32', light: true },
        { id: 'silver', name: '银', label: '银色', hex: '#A8B4C2', light: true },
        { id: 'skin', name: '肉', label: '肉色', hex: '#DDB69A', light: true }
      ];
      const STORAGE_KEY = 'color-draw-selected-v2';
      const $ = (id) => document.getElementById(id);
      const ui = {
        app: $('app'), counter: $('counter'), caption: $('caption'), colorChar: $('colorChar'),
        resultName: $('resultName'), colorCode: $('colorCode'), draw: $('drawButton'),
        reset: $('resetButton'), chips: $('chips'), historyCount: $('historyCount')
      };

      const getSaved = () => {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          const valid = COLORS.map((color) => color.id);
          return Array.isArray(value)
            ? value.filter((id, index) => valid.includes(id) && value.indexOf(id) === index)
            : [];
        } catch { return []; }
      };

      let selectedIds = getSaved();

      const save = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(selectedIds)); } catch {}
      };

      const randomIndex = (length) => {
        if (globalThis.crypto?.getRandomValues) {
          const limit = Math.floor(0x100000000 / length) * length;
          const values = new Uint32Array(1);
          do { crypto.getRandomValues(values); } while (values[0] >= limit);
          return values[0] % length;
        }
        return Math.floor(Math.random() * length);
      };

      const setTheme = (color) => {
        const light = !color || color.light;
        const bg = color?.hex || '#F4F0E8';
        const ink = light ? '#20232A' : '#FFFFFF';
        const muted = light ? '#6D6B67' : 'rgba(255,255,255,.76)';
        const line = light ? 'rgba(32,35,42,.18)' : 'rgba(255,255,255,.38)';
        document.documentElement.style.setProperty('--bg', bg);
        document.documentElement.style.setProperty('--ink', ink);
        document.documentElement.style.setProperty('--muted', muted);
        document.documentElement.style.setProperty('--line', line);
        document.documentElement.style.setProperty('--button-bg', light ? '#20232A' : '#FFFFFF');
        document.documentElement.style.setProperty('--button-ink', light ? '#FFFFFF' : '#20232A');
        document.querySelector('meta[name="theme-color"]').content = bg;
      };

      const render = (animate = false) => {
        const selected = selectedIds.map((id) => COLORS.find((color) => color.id === id));
        const current = selected.at(-1) || null;
        const finished = selected.length === COLORS.length;
        const remaining = COLORS.length - selected.length;

        setTheme(current);
        ui.counter.textContent = `剩余 ${remaining} / ${COLORS.length}`;
        ui.historyCount.textContent = `${selected.length} / ${COLORS.length}`;
        ui.colorChar.textContent = current?.name || '?';
        ui.resultName.textContent = current?.label || '下一种，会是什么颜色？';
        ui.colorCode.innerHTML = current ? current.hex : '&nbsp;';
        ui.caption.textContent = finished ? '13种颜色已全部抽完' : current ? '这一次抽到' : '13种颜色 · 每种只会出现一次';
        ui.draw.textContent = finished ? '重新开始' : current ? '继续抽取' : '开始抽取';
        ui.reset.classList.toggle('visible', Boolean(current) && !finished);

        ui.chips.replaceChildren();
        if (!selected.length) {
          const note = document.createElement('p');
          note.className = 'empty-note';
          note.textContent = '抽到的颜色会依次出现在这里';
          ui.chips.append(note);
        } else {
          selected.forEach((color) => {
            const chip = document.createElement('span');
            chip.className = 'chip';
            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.style.backgroundColor = color.hex;
            chip.append(dot, document.createTextNode(color.name));
            ui.chips.append(chip);
          });
        }

        if (animate) {
          ui.app.classList.remove('pop');
          requestAnimationFrame(() => ui.app.classList.add('pop'));
          setTimeout(() => ui.app.classList.remove('pop'), 460);
        }
      };

      const draw = () => {
        const remaining = COLORS.filter((color) => !selectedIds.includes(color.id));
        if (!remaining.length) return reset();
        const picked = remaining[randomIndex(remaining.length)];
        selectedIds = [...selectedIds, picked.id];
        save();
        render(true);
        return picked;
      };

      const reset = () => {
        selectedIds = [];
        save();
        render(false);
      };

      ui.draw.addEventListener('click', draw);
      ui.reset.addEventListener('click', reset);
      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space' && event.target === document.body) {
          event.preventDefault();
          draw();
        }
      });

      const registerWebMCP = () => {
        const context = document.modelContext;
        if (!context?.registerTool) return;
        const controller = new AbortController();
        const common = { signal: controller.signal };
        try {
          void Promise.resolve(context.registerTool({
            name: 'draw_next_color',
            title: '抽取下一种颜色',
            description: '从当前还未抽到的颜色中随机抽取一种，并同步更新页面记录。全部抽完时会明确返回完成状态。',
            inputSchema: { type: 'object', properties: {}, additionalProperties: false },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) {
              if (!input || typeof input !== 'object' || Array.isArray(input) || Object.keys(input).length) {
                throw new TypeError('输入必须是空对象');
              }
              const remainingBefore = COLORS.length - selectedIds.length;
              if (!remainingBefore) return { status: 'completed', remaining: 0 };
              const picked = draw();
              return { status: 'drawn', color: picked.label, hex: picked.hex, remaining: remainingBefore - 1 };
            }
          }, common)).catch(() => {});
          void Promise.resolve(context.registerTool({
            name: 'reset_color_draw',
            title: '重新开始抽颜色',
            description: '清空当前一轮已经抽到的颜色，恢复全部13种颜色。',
            inputSchema: { type: 'object', properties: {}, additionalProperties: false },
            annotations: { readOnlyHint: false, untrustedContentHint: false },
            execute(input) {
              if (!input || typeof input !== 'object' || Array.isArray(input) || Object.keys(input).length) {
                throw new TypeError('输入必须是空对象');
              }
              reset();
              return { status: 'reset', remaining: COLORS.length };
            }
          }, common)).catch(() => {});
        } catch {}
      };

      render(false);
      registerWebMCP();
    })();
  </script>
</body>
</html>
